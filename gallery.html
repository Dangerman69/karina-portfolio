<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Chris Dane German</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Pinyon+Script&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --fg: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      scroll-behavior: smooth;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.75rem 1rem;
      z-index: 100;
      background: transparent;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 2.5rem;
    }

    .navbar a {
      color: var(--fg);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .navbar a:hover {
      opacity: 1;
    }

    .navbar a.active {
      opacity: 1;
      font-weight: 700;
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .page {
      padding: 7rem 1.5rem 4rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .page-header h1 {
      font-family: 'Viaoda Libre', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      margin-bottom: 0.6rem;
    }

    .page-header p {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(1.2rem, 2.4vw, 1.6rem);
      opacity: 0.9;
    }

    .gallery-grid {
      column-count: 3;
      column-gap: 1rem;
    }

    .photo-card {
      display: inline-block;
      width: 100%;
      margin: 0 0 1rem;
      break-inside: avoid;
      cursor: pointer;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .photo-card:hover {
      transform: translateY(-3px);
      opacity: 0.95;
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.12);
      filter: grayscale(100%);
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .photo-card:hover img {
      transform: scale(1.01);
      filter: grayscale(90%);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.show {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-inner {
      position: relative;
      max-width: min(92vw, 1000px);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    .lightbox img {
      display: block;
      width: 100%;
      max-height: 84vh;
      object-fit: contain;
      box-shadow: 0 18px 50px rgba(0,0,0,0.45);
    }

    .lightbox button {
      position: absolute;
      background: transparent;
      border: none;
      color: var(--fg);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.2rem 0.5rem;
      transition: opacity 0.2s ease;
    }

    .lightbox button:hover {
      opacity: 0.8;
    }

    .close-btn {
      top: -2.4rem;
      right: 0;
    }

    .prev-btn {
      left: -2.8rem;
    }

    .next-btn {
      right: -2.8rem;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 900px) {
      .gallery-grid {
        column-count: 2;
      }
    }

    @media (max-width: 640px) {
      .navbar ul {
        gap: 1rem;
      }

      .navbar a {
        font-size: 0.72rem;
      }

      .page {
        padding-top: 6.5rem;
      }

      .gallery-grid {
        column-count: 1;
      }

      .lightbox {
        padding: 1rem;
      }

      .prev-btn {
        left: 0.5rem;
        top: auto;
        bottom: 0.7rem;
      }

      .next-btn {
        right: 0.5rem;
        top: auto;
        bottom: 0.7rem;
      }

      .close-btn {
        top: 0.5rem;
        right: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" class="active" aria-current="page">Gallery</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main class="page">
    <header class="page-header reveal">
      <h1>Print Gallery</h1>
    </header>

    <section class="gallery-grid reveal" aria-label="Photo gallery">
      <article class="photo-card" data-index="0">
        <img src="DJI_0402.jpg" alt="Landscape print preview 1">
      </article>
      <article class="photo-card" data-index="1">
        <img src="DSC_0032.jpg" alt="Landscape print preview 2">
      </article>
      <article class="photo-card" data-index="2">
        <img src="DSC_0168.jpg" alt="Landscape print preview 3">
      </article>
      <article class="photo-card" data-index="3">
        <img src="DSC_0220.jpg" alt="Landscape print preview 4">
      </article>
      <article class="photo-card" data-index="4">
        <img src="DSC_2016.jpg" alt="Landscape print preview 5">
      </article>
      <article class="photo-card" data-index="5">
        <img src="DSC_3830-HDR.jpg" alt="Landscape print preview 6">
      </article>
      <article class="photo-card" data-index="6">
        <img src="DSC_7016.jpg" alt="Landscape print preview 7">
      </article>
      <article class="photo-card" data-index="7">
        <img src="DSC_7985.jpg" alt="Landscape print preview 8">
      </article>
      <article class="photo-card" data-index="8">
        <img src="DSC_7346.jpg" alt="Landscape print preview 9">
      </article>
      <article class="photo-card" data-index="9">
        <img src="DSC_8473.jpg" alt="Landscape print preview 10">
      </article>
      <article class="photo-card" data-index="10">
        <img src="DSC_9452.jpg" alt="Landscape print preview 11">
      </article>
      <article class="photo-card" data-index="11">
        <img src="Wess.sled.4x3-2-Edit-2.jpg" alt="Landscape print preview 12">
      </article>
    </section>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-inner">
      <button class="prev-btn" aria-label="Previous image">&#10094;</button>
      <img id="lightbox-image" src="" alt="Enlarged photo preview">
      <button class="next-btn" aria-label="Next image">&#10095;</button>
      <button class="close-btn" aria-label="Close gallery">&times;</button>
    </div>
  </div>

  <script>
    const revealItems = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    revealItems.forEach((item) => observer.observe(item));

    const images = Array.from(document.querySelectorAll('.photo-card img'));
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const closeBtn = document.querySelector('.close-btn');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');
    const cards = Array.from(document.querySelectorAll('.photo-card'));
    let activeIndex = 0;

    function openLightbox(index) {
      activeIndex = index;
      lightboxImage.src = images[index].src;
      lightboxImage.alt = images[index].alt;
      lightbox.classList.add('show');
      lightbox.setAttribute('aria-hidden', 'false');
    }

    function closeLightbox() {
      lightbox.classList.remove('show');
      lightbox.setAttribute('aria-hidden', 'true');
    }

    function showNext() {
      activeIndex = (activeIndex + 1) % images.length;
      lightboxImage.src = images[activeIndex].src;
      lightboxImage.alt = images[activeIndex].alt;
    }

    function showPrev() {
      activeIndex = (activeIndex - 1 + images.length) % images.length;
      lightboxImage.src = images[activeIndex].src;
      lightboxImage.alt = images[activeIndex].alt;
    }

    cards.forEach((card, index) => {
      card.addEventListener('click', () => openLightbox(index));
    });

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', showPrev);
    nextBtn.addEventListener('click', showNext);

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (lightbox.getAttribute('aria-hidden') === 'false') {
        if (event.key === 'Escape') closeLightbox();
        if (event.key === 'ArrowRight') showNext();
        if (event.key === 'ArrowLeft') showPrev();
      }
    });
  </script>
</body>
</html>
