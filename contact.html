<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Chris Dane German</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Pinyon+Script&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --fg: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.75rem 1rem;
      z-index: 100;
      background: transparent;
    }

    .navbar ul {
      list-style: none;
      display: flex;
      gap: 2.5rem;
    }

    .navbar a {
      color: var(--fg);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    .navbar a:hover {
      opacity: 1;
    }

    .navbar a.active {
      opacity: 1;
      font-weight: 700;
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7rem 1.5rem 3rem;
    }

    .contact-card {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .contact-card h1 {
      font-family: 'Viaoda Libre', serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 400;
      margin-bottom: 0.7rem;
    }

    .contact-card p {
      font-family: 'Pinyon Script', cursive;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .field {
      position: relative;
    }

    input,
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--fg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      padding: 0.8rem 0.1rem 0.8rem 0;
      outline: none;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255,255,255,0.55);
      opacity: 1;
    }

    input:focus,
    textarea:focus {
      color: var(--fg);
    }

    .submit-btn {
      align-self: center;
      margin-top: 0.5rem;
      border: 1px solid var(--fg);
      background: var(--fg);
      color: var(--bg);
      padding: 0.95rem 1.8rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .submit-btn:hover {
      background: var(--bg);
      color: var(--fg);
    }

    .social {
      margin-top: 1.8rem;
    }

    .social a {
      color: var(--fg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      transition: opacity 0.2s ease;
    }

    .social a:hover {
      opacity: 0.8;
    }

    .thank-you {
      display: none;
      margin-top: 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.9);
    }

    .thank-you.show {
      display: block;
    }

    @media (max-width: 480px) {
      .navbar ul {
        gap: 1rem;
      }

      .navbar a {
        font-size: 0.72rem;
      }

      .contact-card {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
    </ul>
  </nav>

  <main class="page">
    <section class="contact-card reveal" aria-label="Contact form">
      <h1>Get in touch</h1>
      <p>For prints, commissions, or stories worth telling.</p>

      <form id="contactForm">
        <div class="field">
          <input type="text" id="name" name="name" placeholder="Name" required>
        </div>
        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email" required>
        </div>
        <div class="field">
          <textarea id="message" name="message" placeholder="Message" required></textarea>
        </div>
        <button class="submit-btn" type="submit">Send</button>
      </form>

      <div class="thank-you" id="thankYou">Thank you. I’ll be in touch soon.</div>

      <div class="social">
        <a href="https://www.instagram.com" target="_blank" rel="noreferrer" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
            <circle cx="12" cy="12" r="4.5"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <script>
    const revealItems = document.querySelectorAll('.reveal');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    revealItems.forEach((item) => observer.observe(item));

    const form = document.getElementById('contactForm');
    const thankYou = document.getElementById('thankYou');

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      thankYou.classList.add('show');
      form.reset();
    });
  </script>
</body>
</html>
